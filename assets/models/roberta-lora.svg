<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">RoBERTa-base with LoRA model overview</title>
  <desc id="desc">A visual summary of the structured review input, frozen RoBERTa backbone, rank 16 adapters, and validation results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09162f"/>
      <stop offset="1" stop-color="#182b52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#4f9dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="130" fill="#55d6be" opacity=".08"/>
  <circle cx="1020" cy="500" r="210" fill="#4f9dff" opacity=".07"/>

  <text x="64" y="72" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">RoBERTa-base + LoRA</text>
  <text x="64" y="106" fill="#9fb1d4" font-family="Segoe UI,Arial,sans-serif" font-size="18">Parameter-efficient rating classification · rank 16 · sequence length 256</text>

  <g filter="url(#shadow)">
    <rect x="64" y="148" width="260" height="214" rx="20" fill="#112445" stroke="#34517d"/>
    <text x="88" y="184" fill="#55d6be" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">STRUCTURED INPUT</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e9efff">
      <text x="88" y="224">Verified purchase</text>
      <text x="88" y="260">Helpful-vote bucket</text>
      <text x="88" y="296">Review summary</text>
      <text x="88" y="332">Full review text</text>
    </g>
    <g fill="#55d6be">
      <circle cx="299" cy="218" r="5"/><circle cx="299" cy="254" r="5"/><circle cx="299" cy="290" r="5"/><circle cx="299" cy="326" r="5"/>
    </g>
  </g>

  <path d="M342 255h70" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M403 246l12 9-12 9" fill="none" stroke="#4f9dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="430" y="148" width="336" height="214" rx="20" fill="#112445" stroke="#34517d"/>
    <text x="454" y="184" fill="#4f9dff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">FROZEN BACKBONE</text>
    <rect x="454" y="207" width="288" height="52" rx="12" fill="#182f57"/>
    <text x="598" y="240" text-anchor="middle" fill="#e9efff" font-family="Segoe UI,Arial,sans-serif" font-size="19">RoBERTa Transformer</text>
    <rect x="454" y="276" width="136" height="58" rx="12" fill="#153d4a" stroke="#55d6be"/>
    <rect x="606" y="276" width="136" height="58" rx="12" fill="#153d4a" stroke="#55d6be"/>
    <text x="522" y="311" text-anchor="middle" fill="#9ff2e2" font-family="Segoe UI,Arial,sans-serif" font-size="17">LoRA A</text>
    <text x="674" y="311" text-anchor="middle" fill="#9ff2e2" font-family="Segoe UI,Arial,sans-serif" font-size="17">LoRA B</text>
  </g>

  <path d="M784 255h70" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M845 246l12 9-12 9" fill="none" stroke="#4f9dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="872" y="148" width="264" height="214" rx="20" fill="#112445" stroke="#34517d"/>
    <text x="896" y="184" fill="#55d6be" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">RATING HEAD</text>
    <text x="1004" y="252" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">1 · 2 · 3 · 4 · 5</text>
    <text x="1004" y="302" text-anchor="middle" fill="#9fb1d4" font-family="Segoe UI,Arial,sans-serif" font-size="17">Sparse categorical logits</text>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="424" fill="#9fb1d4" font-size="15">VALIDATION MICRO-F1</text>
    <text x="64" y="468" fill="#f5f8ff" font-size="34" font-weight="700">0.6748</text>
    <text x="304" y="424" fill="#9fb1d4" font-size="15">MACRO-F1</text>
    <text x="304" y="468" fill="#f5f8ff" font-size="34" font-weight="700">0.6751</text>
    <text x="500" y="424" fill="#9fb1d4" font-size="15">TRAINABLE</text>
    <text x="500" y="468" fill="#55d6be" font-size="34" font-weight="700">3.26%</text>
    <text x="740" y="424" fill="#9fb1d4" font-size="15">PARAMETERS UPDATED</text>
    <text x="740" y="468" fill="#f5f8ff" font-size="34" font-weight="700">4.18M</text>
    <rect x="1004" y="420" width="132" height="50" rx="25" fill="#153d4a" stroke="#55d6be"/>
    <text x="1070" y="451" text-anchor="middle" fill="#9ff2e2" font-size="16" font-weight="700">EFFICIENT</text>
  </g>
</svg>
